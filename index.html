<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI Explorer - Motor de Validação</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #1e1e1e; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { background: #252526; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; border: 1px solid #333; }
        h2 { margin-top: 0; color: #61afef; font-size: 1.5rem; }
        .status-bar { font-size: 0.85rem; color: #98c379; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; background: #e5c07b; border-radius: 50%; display: inline-block; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3e3e42; background: #1e1e1e; color: #fff; font-size: 1rem; }
        input:focus { outline: none; border-color: #61afef; }
        button { padding: 12px 20px; background: #61afef; color: #1e1e1e; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #5294c9; }
        button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
        .secondary { margin-top: 10px; background: #3e3e42; color: #fff; }
        .console { background: #000; padding: 15px; border-radius: 6px; font-family: monospace; color: #abb2bf; min-height: 100px; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid #3e3e42;}
        .match { color: #98c379; font-weight: bold; }
        .ancora { color: #e5c07b; }
        .research { color: #61afef; }
        .pending { color: #e5c07b; }
        .notion { color: #c678dd; }
        .success { color: #98c379; }
        .proposal-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <h2>CSI Motor Explorer 🔍</h2>
        <div class="status-bar">
            <span class="dot" id="led"></span>
            <span id="status-text">Conectando à Nuvem (GitHub)...</span>
        </div>

        <div class="input-group">
            <input type="text" id="termoInput" placeholder="Digite um termo. Ex: fever, espinha caída, avc..." autocomplete="off" autocapitalize="sentences" spellcheck="true" >
            <button id="btnBuscar" onclick="realizarBusca()">Traduzir</button>
        </div>

        <div class="console" id="terminal">Aguardando entrada de dados...</div>
        <div class="proposal-actions">
            <button class="secondary" id="btnEnviarNotion" onclick="enviarPropostaAoNotion()" disabled>🧬 Enviar proposta ao CSI / Notion</button>
            <button class="secondary" id="btnExportar" onclick="exportarFila()" disabled>Exportar propostas pendentes</button>
        </div>
    </div>

    <script src="docs/Js/csi-engine.js"></script>
    <script src="docs/Js/csi-umls.js"></script>
    <script src="docs/Js/csi-ncbi.js"></script>

    <script>
        // Mantemos o banco no próprio site para evitar falhas de CORS/rede do raw.githubusercontent.com.
        const URL_CORE = "./data/csi_master.json";
        const URL_SINTOMAS = "./data/csi_sintomas.json";

        // Opcional: preencher futuramente com o e-mail registrado no NCBI.
        window.CSI_CONFIG = window.CSI_CONFIG || {
            ncbiEmail: "",
            UMLS_API_BASE: "https://diagnosys-umls-proxy.dr-delyone.workers.dev/api/umls",
            NOTION_PROPOSAL_API: ""
        };

        let bancoDeDados = [];
        let ultimaProposta = null;
        let engineReady = false;

        async function bootEngine() {
            try {
                const [resCore, resSintomas] = await Promise.all([
                    fetch(URL_CORE),
                    fetch(URL_SINTOMAS)
                ]);

                if (!resCore.ok || !resSintomas.ok) throw new Error("Arquivo não encontrado no servidor.");

                const core = await resCore.json();
                const sintomas = await resSintomas.json();

                if (core.dicionario_canonico) bancoDeDados = bancoDeDados.concat(core.dicionario_canonico);
                if (sintomas.coluna_central_semiologia) bancoDeDados = bancoDeDados.concat(sintomas.coluna_central_semiologia);

                document.getElementById('led').style.background = "#98c379";
                document.getElementById('status-text').innerText = "CSI Cloud Engine Conectado e Operante!";
                engineReady = true;
                document.getElementById('termoInput').disabled = false;
                document.getElementById('btnBuscar').disabled = false;
                document.getElementById('btnExportar').disabled = false;
                document.getElementById('btnEnviarNotion').disabled = false;
                const input = document.getElementById('termoInput');
                input.focus();
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' && !event.isComposing) {
                        event.preventDefault();
                        realizarBusca();
                    }
                });
                escreverConsole("Base de dados carregada com sucesso. Pode pesquisar!");
            } catch (error) {
                document.getElementById('led').style.background = "#e06c75";
                document.getElementById('status-text').innerText = "Falha na conexão com o GitHub.";
                escreverConsole("ERRO: Não foi possível baixar os dados.\nDetalhe: " + error.message);
            }
        }

        async function realizarBusca() {
            const input = document.getElementById('termoInput').value.trim();
            if (!input) return;
            if (!engineReady) {
                escreverConsole("A biblioteca ainda está carregando. Tente novamente em um instante.");
                return;
            }

            escreverConsole("Analisando o input: \"" + escapeHtml(input) + "\"...");

            const exact = CSIEngine.findExact(input, bancoDeDados);

            if (exact) {
                escreverConsole(
                    `\\n[CSI — mapeamento local]\\n<span class="match">Nome Canônico:</span> ${exact.canonicalName}\\n<span class="ancora">Âncora:</span> [${exact.anchor}]`,
                    true
                );
                return;
            }

            escreverConsole(
                `\\n[CSI] Termo ausente no dicionário local.\\n<span class="research">Consultando UMLS...</span>`,
                true
            );

            try {
                const umls = await CSIUMLS.search(input, { pageSize: 10 });
                const primary = umls.results[0] || null;
                let umlsAtoms = [];
                if (primary?.cui) {
                    try {
                        const atomData = await CSIUMLS.getAtoms(primary.cui, { pageSize: 30 });
                        umlsAtoms = atomData.atoms || [];
                    } catch (_) {
                        umlsAtoms = [];
                    }
                }

                if (!primary) {
                    escreverConsole(
                        `\\n[UMLS] Nenhum conceito candidato encontrado.\\n<span class="research">Consultando PubMed como fonte complementar...</span>`,
                        true
                    );
                } else {
                    const candidate = CSIEngine.findCanonicalCandidate(primary, bancoDeDados);

                    escreverConsole(
                        `\\n[UMLS — conceito encontrado]\\n<span class="match">CUI:</span> ${primary.cui || "—"}\\n<span class="match">Conceito:</span> ${primary.name || "—"}\\n<span class="ancora">Correspondência CSI:</span> ${candidate ? candidate.canonicalName + " [" + candidate.anchor + "]" : "nenhuma âncora existente"}`,
                        true
                    );

                    let research = null;
                    try {
                        research = await CSINCbi.searchPubMed(
                            primary.name || input,
                            { retmax: 5 }
                        );
                    } catch (_) {
                        research = null;
                    }

                    const proposal = CSIEngine.buildProposal(input, {
                        umlsQuery: input,
                        umlsResult: primary,
                        umlsAtoms,
                        canonicalCandidate: candidate,
                        research
                    });

                    ultimaProposta = CSIEngine.queueProposal(proposal);

                    escreverConsole(
                        `\\n[Proposta de Expansão]\\n<span class="pending">Código:</span> ${proposal.codigo_provisorio}\\n<span class="pending">Tipo:</span> ${proposal.tipo}\\n<span class="pending">Status:</span> pending_review\\n<span class="research">PubMed:</span> ${proposal.evidencias.length} evidências\\n\\nA UMLS identificou o conceito. A entrada ainda NÃO foi promovida automaticamente ao dicionário.`,
                        true
                    );
                    return;
                }

                // Se a UMLS não encontrou conceito, PubMed permanece como descoberta secundária.
                const research = await CSINCbi.searchPubMed(input, { retmax: 5 });

                if (!research.results.length) {
                    escreverConsole("\\nNenhuma evidência suficiente para gerar proposta.", true);
                    return;
                }

                const proposal = CSIEngine.buildProposal(input, { research });
                ultimaProposta = CSIEngine.queueProposal(proposal);

                escreverConsole(
                    `\\n[Proposta bibliográfica]\\n<span class="pending">Código:</span> ${proposal.codigo_provisorio}\\n<span class="pending">Status:</span> pending_review\\n<span class="research">PubMed:</span> ${proposal.evidencias.length} evidências\\n\\nSem conceito UMLS, esta proposta é apenas bibliográfica e exige revisão semântica.`,
                    true
                );
            } catch (error) {
                escreverConsole(
                    "\\n[Serviço externo indisponível]\\nNão foi possível concluir a resolução UMLS/PubMed.\\nDetalhe: " + escapeHtml(error.message),
                    true
                );
            }
        }


        async function enviarPropostaAoNotion() {
            if (!ultimaProposta) {
                escreverConsole("\nPrimeiro faça uma busca que gere uma proposta pendente.", true);
                return;
            }

            const endpoint = String(window.CSI_CONFIG?.NOTION_PROPOSAL_API || "").trim();
            if (!endpoint) {
                escreverConsole("\n<span class=\"notion\">Notion ainda não configurado:</span> defina CSI_CONFIG.NOTION_PROPOSAL_API com o endpoint do Worker seguro.", true);
                return;
            }

            const button = document.getElementById('btnEnviarNotion');
            button.disabled = true;
            const oldLabel = button.innerText;
            button.innerText = "Enviando…";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({ proposal: ultimaProposta })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || "Worker retornou HTTP " + response.status);

                escreverConsole(
                    "\n<span class=\"success\">✓ Proposta gravada no Notion.</span>\n<span class=\"notion\">ID:</span> " +
                    (data.page_id || "—") +
                    "\n<span class=\"pending\">Status:</span> pending_review\n\nEla fica no CSI aguardando revisão/aceite; nada é promovido automaticamente.",
                    true
                );
            } catch (error) {
                escreverConsole("\n<span class=\"pending\">Falha ao gravar no Notion.</span>\nDetalhe: " + error.message, true);
            } finally {
                button.disabled = false;
                button.innerText = oldLabel;
            }
        }

        function exportarFila() {
            const queue = CSIEngine.readQueue();
            const blob = new Blob([JSON.stringify(queue, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "csi_expansion_queue.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escreverConsole(texto, append = false) {
            const terminal = document.getElementById('terminal');
            if (append) terminal.innerHTML += texto;
            else terminal.innerHTML = texto;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Keep the UI responsive to Portuguese accents, Unicode and punctuation.
        // Only markup generated by this application is interpreted as HTML.
        function textoSeguro(value) {
            return escapeHtml(value).replace(/\n/g, "<br>");
        }

        window.addEventListener('load', bootEngine);
    </script>

</body>
</html>
